# Audit database, Airflow and the API. Ports are bound to localhost only.
name: dqf

x-db-url: &db_url postgresql+psycopg2://dq:${POSTGRES_PASSWORD:-dq_local_demo}@postgres:5432/dq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dq_local_demo}
      POSTGRES_DB: dq
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dq"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dq:${POSTGRES_PASSWORD:-dq_local_demo}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: local-demo-only
      DATABASE_URL: *db_url
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./data:/opt/airflow/data:ro
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname a --lastname b \
          --role Admin --email admin@example.com || true
        airflow scheduler &
        exec airflow webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 2g

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *db_url
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    mem_limit: 512m
